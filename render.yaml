services:
  - type: web
    name: tempoalerta-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: VITE_API_URL
        value: https://tempoalerta-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
